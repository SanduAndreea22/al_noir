{% extends 'base.html' %}
{% block content %}<section class="container py-5"><h1>{{ event.title }}</h1><p>{{ event.starts_at|date:'d.m.Y H:i' }} · {% if event.is_free %}gratuit{% else %}{{ event.ticket_price }} lei/bilet{% endif %}</p><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label>{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="btn btn-dark">Rezervă biletul</button></form></section>{% endblock %}
