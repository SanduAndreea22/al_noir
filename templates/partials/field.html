{# Renders one Django form field: label, control, hint and errors. Usage: {% include 'partials/field.html' with field=form.name %} #}
<div class="field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}" class="field-label">{{ field.label }}{% if field.field.required %}<span class="field-req" aria-hidden="true"> *</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="field-hint">{{ field.help_text|safe }}</p>{% endif %}
    {% for error in field.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}
</div>
