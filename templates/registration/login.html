{% extends 'base.html' %}
{% block content %}<section class="container py-5"><h1>Login</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label>{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="btn btn-dark">Log In</button></form><p class="mt-3">Don't have an account? <a href="{% url 'register' %}">Create one</a>.</p></section>{% endblock %}
